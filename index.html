<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#78c9f6">
<title>Banner Miles</title>
<style>
html,body{margin:0;height:100%;background:#84cdf6;font-family:Arial,sans-serif}
#loading{height:100%;display:grid;place-items:center;color:#173d59;font-weight:700}
</style>
</head>
<body>
<div id="loading">Loading Banner Miles…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./game.html?v=20260820-2',{cache:'no-store'});
    if(!response.ok)throw new Error('Game file could not be loaded');
    let html=await response.text();
    html=html.replace('</body>','<script src="./patch.js?v=20260820-2"><\\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('loading').textContent='Banner Miles failed to load. Refresh the page.';
  }
})();
</script>
</body>
</html>
